<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Trail editor</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#141a17;color:#e9efe9;font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
form{width:100%;max-width:340px;background:#1f2a24;border:1px solid #33433a;border-radius:16px;padding:24px;box-sizing:border-box}
h1{font-size:22px;margin:0 0 4px}p{margin:0 0 16px;color:#a9b8ad;font-size:14px}
input[type=password]{width:100%;box-sizing:border-box;font-size:17px;padding:12px;border-radius:10px;border:1px solid #46584d;background:#111613;color:#fff}
label.rm{display:flex;gap:8px;align-items:center;margin:14px 0;font-size:14px;color:#c9d6cc}
button{width:100%;font-size:17px;font-weight:600;padding:12px;border:0;border-radius:10px;background:#e8702a;color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{min-height:20px;margin-top:12px;font-size:14px}#msg.err{color:#ff8f80}
progress{width:100%;margin-top:12px;display:none}
</style>
</head>
<body>
<main>
<form id="f" autocomplete="on">
<h1>Trail editor</h1>
<p>This page is locked. Enter the password to open it.</p>
<input type="text" name="username" value="trail-editor" autocomplete="username" hidden>
<input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
<label class="rm"><input id="rm" type="checkbox" checked> Remember on this device</label>
<button id="go" type="submit">Unlock</button>
<progress id="pg" max="1" value="0"></progress>
<div id="msg" role="status" aria-live="polite"></div>
</form>
</main>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const enc = new TextEncoder(), dec = new TextDecoder();
  const DBN = 'trail-editor-site', ST = 'keys';
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open(DBN, 1); r.onupgradeneeded = () => r.result.createObjectStore(ST); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const idbDo = async (mode, fn) => { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(ST, mode); const q = fn(tx.objectStore(ST)); tx.oncomplete = () => res(q && q.result); tx.onerror = tx.onabort = () => rej(tx.error); }); };
  const keyGet = () => idbDo('readonly', (s) => s.get('kek')).catch(() => null);
  const keyPut = (k) => idbDo('readwrite', (s) => s.put(k, 'kek')).catch(() => null);
  const keyDel = () => idbDo('readwrite', (s) => s.delete('kek')).catch(() => null);
  const msg = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; };
  let P;

  async function deriveKek(pw) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.kdf.salt), iterations: P.kdf.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function unwrap(kek) {
    const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.wrap.iv), additionalData: enc.encode(P.wrap.aad) }, kek, b64(P.wrap.ct));
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  }
  async function getFile(dek, name) {
    const r = await fetch('d/' + name + '.bin', { cache: 'no-cache' });
    if (!r.ok) throw new Error('missing ' + name);
    const buf = new Uint8Array(await r.arrayBuffer());
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.subarray(0, 12) }, dek, buf.subarray(12)));
  }

  function localEdits(M) {
    // Keep on-device edits across updates: never delete them; back them up when the published plan changes.
    const id = M.trip_id, k = 'trip_' + id, bk = 'te_site_base_' + id;
    let state = 'none';
    try {
      const saved = localStorage.getItem(k), base = localStorage.getItem(bk);
      if (!saved) localStorage.setItem(bk, M.recipe_hash);
      else if (base !== M.recipe_hash) {
        localStorage.setItem(k + '__backup_' + (base || 'unknown').slice(0, 12), saved);
        state = 'newer';
      }
    } catch (e) {}
    return state;
  }
  function banner(M) {
    const when = new Date(M.built).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
    return `<div id="teUpd" role="status" style="position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:2147483647;background:#1f2a24;color:#fff;border:1px solid #e8702a;border-radius:12px;padding:12px;font:14px/1.4 system-ui,sans-serif;box-shadow:0 6px 24px #0008;max-width:560px;margin:auto">
<b>The editor was updated</b> (published ${when}). Your edits on this device are kept. A backup copy was saved too.
<div style="display:flex;gap:8px;margin-top:10px"><button id="teKeep" style="flex:1;padding:9px;border-radius:8px;border:0;background:#e8702a;color:#fff;font-weight:600">Keep my edits</button><button id="teNew" style="flex:1;padding:9px;border-radius:8px;border:1px solid #6b7d71;background:transparent;color:#fff">Use the new published plan</button></div></div>
<script>(()=>{const k=${JSON.stringify('trip_' + M.trip_id)},bk=${JSON.stringify('te_site_base_' + M.trip_id)},h=${JSON.stringify(M.recipe_hash)};
document.getElementById('teKeep').onclick=()=>{try{localStorage.setItem(bk,h)}catch(e){}document.getElementById('teUpd').remove();};
document.getElementById('teNew').onclick=()=>{try{localStorage.removeItem(k);localStorage.setItem(bk,h)}catch(e){}location.reload();};})();<\/script>`;
  }

  async function boot(dek) {
    $('go').disabled = true; $('pg').style.display = 'block'; msg('Opening…');
    const M = JSON.parse(dec.decode(await getFile(dek, P.manifest)));
    const paths = Object.keys(M.files), urls = {}; let done = 0, total = 0, html = '';
    paths.forEach((p) => total += M.files[p].size);
    let next = 0;
    async function worker() {
      while (next < paths.length) {
        const p = paths[next++], f = M.files[p];
        const data = await getFile(dek, f.f);
        if (p === M.entry) html = dec.decode(data);
        else urls[p] = URL.createObjectURL(new Blob([data], { type: f.type }));
        done += f.size; $('pg').value = done / total;
      }
    }
    await Promise.all([1, 2, 3, 4, 5, 6].map(worker));
    const upd = localEdits(M);
    const shim = `<script>window.__TE_ASSETS=${JSON.stringify(urls)};window.__TE_A=function(p){return window.__TE_ASSETS[p]||p};window.__TE_SITE=${JSON.stringify({ built: M.built, recipe_hash: M.recipe_hash, update: upd })};<\/script>`;
    for (const p of M.scripts) html = html.split(`src="${p}"`).join(`src="${urls[p]}"`);
    html = html.replace(/<head[^>]*>/i, (h) => h + '<meta name="robots" content="noindex,nofollow">' + shim);
    if (upd === 'newer') html = html.replace(/<\/body>/i, banner(M) + '</body>');
    document.open(); document.write(html); document.close();
  }

  async function start() {
    try { P = await (await fetch('params.json', { cache: 'no-cache' })).json(); }
    catch (e) { msg('Could not load the page data. Check your connection and reload.', true); return; }
    if (/[?&#]forget\b/.test(location.search + location.hash)) { await keyDel(); msg('This device no longer remembers the password.'); }
    else {
      const kek = await keyGet();
      if (kek) {
        let dek = null;
        try { dek = await unwrap(kek); } catch (e) { await keyDel(); msg('The password changed. Enter the new one.', true); }
        if (dek) { try { await boot(dek); return; } catch (e) { msg('Could not open: ' + e.message, true); $('go').disabled = false; } }
      }
    }
    $('f').onsubmit = async (ev) => {
      ev.preventDefault(); const pw = $('pw').value; if (!pw) return;
      $('go').disabled = true; msg('Checking…');
      let kek, dek;
      try { kek = await deriveKek(pw); dek = await unwrap(kek); }
      catch (e) { $('go').disabled = false; $('pw').select(); msg('Wrong password. Try again.', true); return; }
      if ($('rm').checked) await keyPut(kek); else await keyDel();
      try { await boot(dek); } catch (e) { $('go').disabled = false; msg('Could not open: ' + e.message, true); }
    };
    $('pw').focus();
  }
  if (!window.crypto || !crypto.subtle) { msg('This browser can’t open the page (needs HTTPS and a current browser).', true); return; }
  start();
})();
</script>
</body>
</html>
